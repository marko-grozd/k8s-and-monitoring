name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/k8s-skeleton-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/k8s-skeleton-frontend:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/skeleton-app-backend \
            backend=${{ secrets.ACR_LOGIN_SERVER }}/k8s-skeleton-backend:${{ github.sha }} \
            -n skeleton
          kubectl set image deployment/skeleton-app-frontend \
            frontend=${{ secrets.ACR_LOGIN_SERVER }}/k8s-skeleton-frontend:${{ github.sha }} \
            -n skeleton
          kubectl rollout status deployment/skeleton-app-backend -n skeleton
          kubectl rollout status deployment/skeleton-app-frontend -n skeleton